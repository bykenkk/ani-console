log_format realtime_session '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/console-sessions/ {
    proxy_pass http://ani-session-gateway-websocket.ani-system:30082/api/v1/realtime/sessions/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 保留握手访问日志，但不记录含 ticket 的查询字符串。
    access_log /var/log/nginx/access.log realtime_session;
  }

  location /api/ {
    proxy_pass http://ani-governance.ani-system:7788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
